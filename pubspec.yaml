name: session_recorder_flutter
description: A lightweight SDK for capturing user interactions and visible UI layout metadata during a Flutter application session.
version: 2.0.0
homepage: https://github.com/opentech-ux/session-recorder-flutter

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.3
  http: ^1.3.0
  uuid: ^4.5.1
  meta: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
